# Showcase stack: the published image serves the component gallery with the
# in-browser mock API enabled. New GHCR packages default to private; if the
# pull is unauthorized, run `docker login ghcr.io` or make the package public.
services:
  react-components:
    container_name: react-components
    image: ghcr.io/cyphix/react-components:${SHOWCASE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SHOWCASE_PORT:-5173}:80"
